# Default properties for StdSchedulerFactory when no other file is specified.
# Spring Boot apps should prefer quartz.scheduler.* (this file is the non-Boot fallback).

#---------------------------- Scheduler ----------------------------
org.quartz.scheduler.instanceName=quartz-scheduler
#org.quartz.scheduler.threadName=QuartzSchedulerThread

#---------------------------- Thread pool ----------------------------
org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount=10
org.quartz.threadPool.threadPriority=5
org.quartz.threadPool.threadsInheritContextClassLoaderOfInitializingThread=true

#---------------------------- Job store ----------------------------
org.quartz.jobStore.class=org.quartz.simpl.RAMJobStore
org.quartz.jobStore.misfireThreshold=60000

# Persistent / clustered example (Mongo replica set + NTP):
#org.quartz.jobStore.class=org.quartz.impl.mongodb.MongoJobStore
#org.quartz.jobStore.mongoUri=mongodb://localhost:27017
#org.quartz.jobStore.dbName=quartz
#org.quartz.jobStore.collectionPrefix=qrtz_
#org.quartz.jobStore.isClustered=true
#org.quartz.jobStore.clusterCheckinInterval=15000

#---------------------------- Plugins ----------------------------
# SPI still works (org.quartz.plugin.<name>.class=your.SchedulerPlugin).

#---------------------------- Listeners ----------------------------
#org.quartz.jobListener.NAME.class=com.foo.MyListenerClass
#org.quartz.triggerListener.NAME.class=com.foo.MyListenerClass
